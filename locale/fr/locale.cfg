[item-description]
smart-train-combinator=Un combinateur de gare qui vérifie individuellement le tampon dédié de chaque wagon.
stc-multi=Un aiguilleur de gare multi-ressources : suit jusqu'à 10 ressources et appelle le train d'une seule ressource à la fois, en commençant toujours par le tampon le plus vide.
stc2-buffer-probe=Une borne passive câblée entre les coffres du tampon d'un wagon et le Combinateur de gare intelligent.
stc-typed-probe=Une sonde de quai fixée à une ressource (module multi-ressources, buffers indépendants).

