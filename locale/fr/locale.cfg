[entity-description]
smart-train-combinator=Le cerveau. Câble-le à la gare et aux sondes de quai. Il lit le tampon de chaque sonde individuellement et n'appelle un train que lorsque le tampon de ce wagon est prêt.
stc-multi=L'aiguilleur multi-ressources. Il suit jusqu'à 10 ressources et renomme la gare pour en réclamer une seule à la fois : il demande toujours le tampon le PLUS VIDE, et maintient ce choix tant qu'un train est en route. Renommage automatique toujours actif ; limite de trains 0 ou 1.
stc2-buffer-probe=Une borne passive, une par wagon. Câble son côté entrée aux coffres du tampon de ce wagon, et son côté sortie au Combinateur de gare intelligent. Elle ne calcule rien par elle-même.
stc-typed-probe=Une sonde de quai fixée à UNE ressource, pour le mode buffer indépendant du module multi-ressources : les wagons d'une ressource sont ses propres sondes typées, donc la longueur du train varie selon la ressource. Câble son entrée aux coffres tampon de cette ressource, sa sortie au combinateur multi. Une sonde par wagon.

